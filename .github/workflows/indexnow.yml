name: IndexNow

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for Pages build of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          for _ in $(seq 1 30); do
            build="$(gh api "repos/${{ github.repository }}/pages/builds/latest")"
            status="$(printf '%s' "$build" | jq -r '.status')"
            commit="$(printf '%s' "$build" | jq -r '.commit')"
            if [ "$status" = "built" ] && [ "$commit" = "$sha" ]; then
              echo "Pages build ready: $commit"
              exit 0
            fi
            sleep 10
          done
          echo "Pages build for $sha did not finish in time"
          exit 1

      - name: Notify IndexNow participants
        run: |
          set -euo pipefail
          key="$(cat 36116e1a-ab38-4110-b67a-2cae8b6b3e42.txt)"
          key_location="https://awesome-long-covid-mecfs.github.io/awesome-long-covid-mecfs/${key}.txt"
          payload="$(jq -n \
            --arg host "awesome-long-covid-mecfs.github.io" \
            --arg key "$key" \
            --arg keyLocation "$key_location" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: [
              "https://awesome-long-covid-mecfs.github.io/awesome-long-covid-mecfs/",
              "https://awesome-long-covid-mecfs.github.io/awesome-long-covid-mecfs/links-de.html"
            ]}')"
          curl --fail --silent --show-error --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "$payload" \
            https://api.indexnow.org/indexnow
